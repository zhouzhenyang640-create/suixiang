<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#FFFFFF">
  <meta name="color-scheme" content="light dark">
  <meta name="description" content="一个像聊天软件一样记录想法的私人空间。">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./assets/icon-192.png">
  <link rel="apple-touch-icon" href="./assets/icon-192.png">
  <link rel="stylesheet" href="./styles.css">
  <link rel="stylesheet" href="./themes.css">
  <title>随想 · 私人聊天室</title>
</head>
<body>
  <div id="app" class="app-shell" aria-live="polite"></div>
  <div id="modal-root"></div>
  <div id="toast-root" class="toast-root" aria-live="assertive"></div>
  <input id="image-picker" type="file" accept="image/*" multiple hidden>
  <input id="backup-picker" type="file" accept="application/json,.json" hidden>
  <script src="./app.js" defer></script>
</body>
</html>
